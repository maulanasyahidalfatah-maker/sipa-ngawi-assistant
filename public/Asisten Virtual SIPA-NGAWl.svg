<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Gradien Utama Cyan - Blue Electric -->
    <linearGradient id="sipaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Gradien Aksen Gold/Kuning Pendidikan -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Gradien Teks Subtitle -->
    <linearGradient id="textSub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glow Effect untuk Elemen AI -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= GROUP BAGIAN IKON (SEBELAH KIRI) ================= -->
  <g transform="translate(10, 0)">
    <!-- Container Shield / Rounded Square Background -->
    <rect x="20" y="20" width="160" height="160" rx="36" fill="#0F172A" stroke="url(#sipaGradient)" stroke-width="4" />

    <!-- Siluet Buku Terbuka Modern -->
    <path 
      d="M 50 135 C 75 122, 92 128, 100 136 C 108 128, 125 122, 150 135 V 75 C 125 62, 108 68, 100 76 C 92 68, 75 62, 50 75 Z" 
      fill="none" 
      stroke="url(#sipaGradient)" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Garis Tengah Buku -->
    <line x1="100" y1="76" x2="100" y2="136" stroke="url(#sipaGradient)" stroke-width="7" stroke-linecap="round" />

    <!-- Pena AI / Sinyal Asisten Digital Memancar ke Atas -->
    <path d="M 100 70 L 100 42" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
    <circle cx="100" cy="38" r="7" fill="#FBBF24" filter="url(#neonGlow)" />

    <!-- Node Sinyal Kiri & Kanan (Simbol AI Assistant) -->
    <circle cx="70" cy="52" r="5" fill="#00F2FE" />
    <circle cx="130" cy="52" r="5" fill="#4FACFE" />
    <line x1="100" y1="70" x2="70" y2="52" stroke="url(#sipaGradient)" stroke-width="3" stroke-dasharray="3 3" />
    <line x1="100" y1="70" x2="130" y2="52" stroke="url(#sipaGradient)" stroke-width="3" stroke-dasharray="3 3" />
  </g>

  <!-- ================= GROUP BAGIAN TEKS "SIPA NGAWI" (SEBELAH KANAN) ================= -->
  <g transform="translate(210, 0)">
    <!-- Tulisan "SIPA" Utama -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="url(#sipaGradient)" letter-spacing="2">
      SIPA
    </text>

    <!-- Badge / Tag "NGAWI" -->
    <rect x="200" y="52" width="135" height="42" rx="10" fill="#1E293B" stroke="url(#goldGradient)" stroke-width="2" />
    <text x="267" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FBBF24" text-anchor="middle" letter-spacing="3">
      NGAWI
    </text>

    <!-- Subtitle / Deskripsi Layanan Dinas -->
    <text x="5" y="145" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="url(#textSub)" letter-spacing="1">
      SISTEM INFORMASI &amp; PELAYANAN ASISTEN
    </text>

    <!-- Tagline Kecil -->
    <text x="5" y="168" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748B" letter-spacing="1.5">
      DINAS PENDIDIKAN DAN KEBUDAYAAN
    </text>
  </g>
</svg>
